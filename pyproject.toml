[project]
name = "poker-league-pro"
version = "0.1.0"
description = "LINE画像からポーカー結果をGoogleスプレッドシートへ記録するアプリ"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cffi==2.1.0",
    "cryptography==49.0.0",
    "duckdb==1.5.4",
    "fastapi==0.128.0",
    "google-api-python-client==2.187.0",
    "google-cloud-vision==3.11.0",
    "httpx==0.28.1",
    "numpy==2.5.1",
    "pandas==2.2.3",
    "pillow==12.3.0",
    "pyarrow==25.0.0",
    "st-gsheets-connection==0.1.0",
    "streamlit==1.57.0",
    "tzdata==2025.3",
    "uvicorn[standard]==0.40.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
